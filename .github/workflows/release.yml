name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 0.1.0 or 0.1.0-beta.1
        required: true
        type: string
      publish:
        description: Push to NuGet
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive and check the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISHING: ${{ inputs.publish || github.event_name == 'push' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not SemVer (e.g. 0.1.0 or 0.1.0-beta.1)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${version%%+*}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' \
            CHANGELOG.md > release-notes.md
          if [ "$PUBLISHING" = true ]; then
            if ! grep -q '[^[:space:]]' release-notes.md; then
              echo "::error::CHANGELOG.md has no '## [$version]' section."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH."
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: build
    if: ${{ inputs.publish || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - uses: NuGet/login@v1
        id: login
        with:
          user: vrimar

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: [version, publish]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE_FLAG: ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
