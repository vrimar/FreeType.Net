name: native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-2022 }
          - { rid: win-arm64, runner: windows-11-arm }
          # The library needs the glibc of the runner that builds it, so the oldest runner sets the floor.
          - { rid: linux-x64, runner: ubuntu-22.04 }
          - { rid: linux-arm64, runner: ubuntu-22.04-arm }
          - { rid: osx-x64, runner: macos-15 }
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: ios-arm64, runner: macos-15 }
          - { rid: iossimulator-arm64, runner: macos-15 }
          - { rid: android-arm64, runner: ubuntu-24.04 }
          - { rid: android-x64, runner: ubuntu-24.04 }
          - { rid: browser-wasm, runner: ubuntu-24.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Pin the Android NDK
        if: startsWith(matrix.rid, 'android-')
        run: echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        if: matrix.rid == 'browser-wasm'
        with:
          global-json-file: global.json

      # From outside the repo, so global.json cannot route the install to another SDK.
      - name: Install the wasm workload
        if: matrix.rid == 'browser-wasm'
        run: cd "$RUNNER_TEMP" && dotnet workload install wasm-tools

      - run: bash build/build-native.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
